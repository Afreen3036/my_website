<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Automated Website</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <nav class="bg-blue-600 p-4 shadow-lg">
        <div class="container mx-auto text-white font-bold text-xl">
            🚀 CI/CD Project 2026
        </div>
    </nav>

    <div class="container mx-auto mt-20 p-8 bg-white rounded-lg shadow-2xl max-w-2xl text-center">
        <h1 class="text-4xl font-extrabold text-gray-800 mb-4">
            Deployment Successful!
        </h1>
        <p class="text-lg text-gray-600 mb-8">
            This page was deployed automatically from <strong>GitHub</strong> to a <strong>VM</strong> without using Jenkins.
        </p>
        
        <div class="flex justify-center space-x-4">
            <div class="p-4 bg-green-100 border-l-4 border-green-500 text-green-700">
                <p class="font-bold">Status</p>
                <p>Live & Running</p>
            </div>
            <div class="p-4 bg-blue-100 border-l-4 border-blue-500 text-blue-700">
                <p class="font-bold">Pipeline</p>
                <p>GitHub Actions</p>
            </div>
        </div>

        <footer class="mt-12 text-gray-400 text-sm">
            Last Updated: February 2026
        </footer>
    </div>

</body>
</html>
